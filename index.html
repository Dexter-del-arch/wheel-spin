<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Spin</title>
    <!-- Favicon pointing directly to logo.png -->
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            overflow: hidden;
            gap: 20px;
        }

        /* Wheel Area: defaults to side position when sidebar is open */
        .wheel-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease;
            transform: translateX(190px); 
        }

        /* When sidebar is closed (.sidebar-closed), wheel moves to the center */
        body.sidebar-closed .wheel-area {
            transform: translateX(0px); 
        }

        .wheel-container {
            position: relative;
            width: 520px;
            height: 520px;
        }

        #canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .pointer-container {
            position: absolute;
            right: -25px;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            z-index: 10;
            filter: drop-shadow(-4px 2px 8px rgba(0,0,0,0.4));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointer-svg {
            width: 100%;
            height: 100%;
            transition: fill 0.15s ease;
        }

        .sidebar {
            width: 380px;
            background: white;
            height: calc(100vh - 40px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, opacity 0.3s ease;
            position: relative;
            z-index: 20;
            order: 2;
            overflow: hidden;
        }

        .sidebar.closed {
            transform: translateX(420px);
            opacity: 0;
            pointer-events: none;
        }

        .toggle-btn {
            position: fixed;
            top: 35px;
            right: 35px;
            background: #2563eb;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            padding: 0;
            z-index: 30;
        }

        .toggle-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            background: #f8fafc;
        }

        .tab-btn {
            padding: 8px 18px;
            border: none;
            background: #e2e8f0;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            color: #475569;
            transition: 0.2s;
            user-select: none;
        }
        .tab-btn.active {
            background: #2563eb;
            color: white;
        }
        .tab-btn.editing {
            background: #7c3aed !important;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.5);
        }

        .tools-bar {
            display: flex;
            gap: 8px;
            padding: 10px 15px;
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-secret {
            background: #7c3aed;
            font-weight: bold;
            min-width: 32px;
            display: none;
        }
        .btn-secret.visible {
            display: inline-block;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .entry-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .entry-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            font-size: 13px;
        }

        .percent-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .fake-input {
            width: 65px;
            padding: 8px 18px 8px 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }

        .percent-symbol {
            position: absolute;
            right: 6px;
            font-size: 12px;
            color: #64748b;
            pointer-events: none;
        }

        .color-picker {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .img-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-remove-img {
            background: #fee2e2;
            color: #ef4444;
            border: 1px solid #fca5a5;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-remove {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .btn-remove:hover {
            color: #ef4444;
        }

        .btn-add {
            margin: 15px auto;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            width: calc(100% - 30px);
            display: block;
        }

        .center-img-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .history-item {
            padding: 10px 12px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            gap: 10px;
        }

        .history-edit-input {
            padding: 4px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            background: #f8fafc;
        }

        .history-clear-all {
            width: 100%;
            background: #fee2e2;
            color: #ef4444;
            border: 1px solid #fca5a5;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .history-clear-all:hover {
            background: #fecaca;
        }

        .chances-overlay {
            position: absolute;
            top: 25px;
            right: 90px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            min-width: 200px;
            display: none;
            z-index: 25;
        }

        .chances-overlay.visible {
            display: block;
        }

        .chances-title {
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            color: #1e293b;
        }

        .chance-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
            color: #334155;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 18px;
            width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            text-align: center;
            animation: popIn 0.25s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
        }

        .winner-title {
            font-size: 22px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .winner-name {
            font-size: 30px;
            font-weight: 800;
            color: #2563eb;
            margin: 15px 0;
            word-break: break-word;
        }
        .winner-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-close {
            flex: 1;
            padding: 10px;
            background: #e2e8f0;
            color: #334155;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-remove-winner {
            flex: 1;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="wheel-area">
        <div class="wheel-container" onclick="spin()">
            <div class="pointer-container">
                <svg class="pointer-svg" viewBox="0 0 100 100">
                    <path d="M 85,20 L 15,50 A 4,4 0 0,0 15,50 L 85,80 A 6,6 0 0,0 93,74 L 93,26 A 6,6 0 0,0 85,20 Z" 
                          id="pointerPath" 
                          fill="#2563eb" 
                          stroke="#ffffff" 
                          stroke-width="5" 
                          stroke-linejoin="round"/>
                </svg>
            </div>
            <canvas id="canvas" width="520" height="520"></canvas>
        </div>
    </div>

    <div class="chances-overlay" id="chancesOverlay">
        <div class="chances-title">📊 Chances:</div>
        <div id="chancesList"></div>
    </div>

    <button class="toggle-btn" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" id="toggleIcon">
            <path d="M5 12h14M12 5l7 7-7 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="tab-btn active" id="entriesTabBtn" onclick="switchTab('settings')" ondblclick="toggleSecretButton()">Entries (<span id="entryCount">0</span>)</button>
            <button class="tab-btn" id="historyTabBtn" onclick="switchTab('history')" ondblclick="toggleHistoryEditMode()">History</button>
        </div>

        <div class="tools-bar" id="toolsBar">
            <button class="btn-action btn-secret" id="secretBtn" onclick="openSecretModal()">S</button>
            <button class="btn-action" onclick="sortEntries()">Sort 🔀</button>
            <button class="btn-action" onclick="shuffleEntries()">Shuffle 🔀</button>
        </div>

        <div class="tab-content active" id="tabSettings">
            <div class="center-img-box">
                <span>Center Image:</span>
                <input type="file" id="centerImgInput" accept="image/*" style="display:none" onchange="loadCenterImage(this)">
                <div id="centerImgControls">
                    <button class="img-btn" onclick="document.getElementById('centerImgInput').click()">📷 Upload</button>
                </div>
            </div>

            <div style="font-size: 11px; color: #64748b; margin-bottom: 8px; display: flex; justify-content: space-between;">
                <span>Name & Color</span>
                <span>Chances</span>
            </div>
            <div id="entriesList"></div>
            <button class="btn-add" onclick="addEntry()">+ Add Entry</button>
        </div>

        <div class="tab-content" id="tabHistory">
            <div id="historyEditControls" style="display: none;">
                <button class="history-clear-all" onclick="clearAllHistory()">🗑️ Clear All History</button>
            </div>
            <ul class="history-list" id="historyList">
                <li style="color: #94a3b8; text-align: center; margin-top: 20px;">No spins yet</li>
            </ul>
        </div>
    </div>

    <div class="modal" id="secretModal">
        <div class="modal-content" style="text-align: left;">
            <h3 style="margin-top:0;">🤫 Real Chances (Secret)</h3>
            <p style="font-size: 12px; color: #64748b;">Set actual probability percentage for each item:</p>
            <div id="secretList"></div>
            <button class="btn-add" style="width: 100%; margin: 15px 0 0 0;" onclick="closeSecretModal()">Save & Close</button>
        </div>
    </div>

    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <div class="winner-title">🎉 We have a winner!</div>
            <div class="winner-name" id="winnerNameText">Winner</div>
            <div class="winner-actions">
                <button class="btn-close" onclick="closeWinnerModal()">Close</button>
                <button class="btn-remove-winner" onclick="removeCurrentWinner()">Remove</button>
            </div>
        </div>
    </div>

    <script>
        const defaultEntries = [
            { name: 'Huge', color: '#2563eb', fakeChance: '50', realWeight: 10, img: null },
            { name: 'Titanic', color: '#dc2626', fakeChance: '30', realWeight: 20, img: null },
            { name: 'Gargantuan', color: '#eab308', fakeChance: '20', realWeight: 70, img: null }
        ];

        let entries = [];
        let history = [];
        let startAngle = 0;
        let isSpinning = false;
        let centerImage = null;
        let lastWinnerIndex = -1;
        let audioCtx = null;
        let lastSliceIndex = -1;
        let isHistoryEditMode = false;
        let isSecretButtonVisible = false;

        const wheelSound = new Audio('Wheel Sound');

        function playTickSound() {
            try {
                const soundClone = wheelSound.cloneNode();
                soundClone.volume = 1.0;
                soundClone.play().catch(e => console.log("Audio play blocked or error:", e));
            } catch(e) {}
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playWinSound() {
            try {
                if (!audioCtx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.08);
                    osc.stop(audioCtx.currentTime + idx * 0.08 + 0.35);
                });
            } catch(e){}
        }

        function saveData() {
            const cleanEntries = entries.map(e => ({
                name: e.name,
                color: e.color,
                fakeChance: e.fakeChance,
                realWeight: e.realWeight,
                imgSrc: e.img ? e.img.src : null
            }));
            localStorage.setItem('wheel_entries', JSON.stringify(cleanEntries));
            localStorage.setItem('wheel_history', JSON.stringify(history));
            if (centerImage) {
                localStorage.setItem('wheel_center_img', centerImage.src);
            } else {
                localStorage.removeItem('wheel_center_img');
            }
        }

        function loadSavedData() {
            const savedEntries = localStorage.getItem('wheel_entries');
            const savedHistory = localStorage.getItem('wheel_history');
            const savedCenterImg = localStorage.getItem('wheel_center_img');

            if (savedEntries) {
                const parsed = JSON.parse(savedEntries);
                entries = parsed.map(e => {
                    let imgObj = null;
                    if (e.imgSrc) {
                        imgObj = new Image();
                        imgObj.src = e.imgSrc;
                        imgObj.onload = () => drawWheel();
                    }
                    return {
                        name: e.name,
                        color: e.color,
                        fakeChance: e.fakeChance,
                        realWeight: e.realWeight,
                        img: imgObj
                    };
                });
            } else {
                entries = defaultEntries;
            }

            if (savedHistory) {
                history = JSON.parse(savedHistory);
                renderHistory();
            }

            if (savedCenterImg) {
                centerImage = new Image();
                centerImage.src = savedCenterImg;
                centerImage.onload = () => {
                    renderCenterImgControls();
                    drawWheel();
                };
            }
        }

        function loadCenterImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        centerImage = img;
                        renderCenterImgControls();
                        drawWheel();
                        saveData();
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeCenterImage() {
            centerImage = null;
            document.getElementById('centerImgInput').value = '';
            renderCenterImgControls();
            drawWheel();
            saveData();
        }

        function renderCenterImgControls() {
            const container = document.getElementById('centerImgControls');
            if (centerImage) {
                container.innerHTML = `<button class="btn-remove-img" onclick="removeCenterImage()">Remove image</button>`;
            } else {
                container.innerHTML = `<button class="img-btn" onclick="document.getElementById('centerImgInput').click()">📷 Upload</button>`;
            }
        }

        function loadEntryImage(input, index) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        entries[index].img = img;
                        renderEntries();
                        saveData();
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeEntryImage(index) {
            entries[index].img = null;
            renderEntries();
            saveData();
        }

        function renderEntries() {
            const list = document.getElementById('entriesList');
            list.innerHTML = '';
            entries.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'entry-row';
                
                let imgControls = item.img ? 
                    `<button class="btn-remove-img" title="Remove image" onclick="removeEntryImage(${index})">❌</button>` : 
                    `<button class="img-btn" onclick="document.getElementById('file-${index}').click()">🖼️</button>`;

                div.innerHTML = `
                    <button class="btn-remove" onclick="removeEntry(${index})">✖</button>
                    <input type="color" class="color-picker" value="${item.color}" onchange="updateColor(${index}, this.value)">
                    ${imgControls}
                    <input type="file" id="file-${index}" accept="image/*" style="display:none" onchange="loadEntryImage(this, ${index})">
                    <input type="text" class="entry-input" value="${item.name}" oninput="updateName(${index}, this.value)">
                    <div class="percent-wrapper">
                        <input type="text" class="fake-input" value="${item.fakeChance}" oninput="updateFakeChance(${index}, this.value)">
                        <span class="percent-symbol">%</span>
                    </div>
                `;
                list.appendChild(div);
            });
            document.getElementById('entryCount').innerText = entries.length;
            drawWheel();
            updateChancesOverlay();
        }

        function updateFakeChance(index, val) {
            entries[index].fakeChance = val;
            drawWheel();
            updateChancesOverlay();
            saveData();
        }

        function updateRealWeight(index, val) {
            entries[index].realWeight = parseFloat(val) || 0;
            saveData();
        }

        function getSliceAngles() {
            const totalFake = entries.reduce((sum, item) => sum + (parseFloat(item.fakeChance) || 0), 0);
            const slices = [];
            let currentAngle = 0;

            entries.forEach((item, i) => {
                let sliceAngle;
                if (totalFake > 0) {
                    sliceAngle = ((parseFloat(item.fakeChance) || 0) / totalFake) * (2 * Math.PI);
                } else {
                    sliceAngle = (2 * Math.PI) / entries.length;
                }
                slices.push({
                    start: currentAngle,
                    angle: sliceAngle,
                    end: currentAngle + sliceAngle
                });
                currentAngle += sliceAngle;
            });

            return slices;
        }

        function drawWheel() {
            if (entries.length === 0) {
                ctx.clearRect(0, 0, 520, 520);
                return;
            }
            
            const sliceAngles = getSliceAngles();
            ctx.clearRect(0, 0, 520, 520);

            entries.forEach((item, i) => {
                const slice = sliceAngles[i];
                const angle = startAngle + slice.start;
                const sliceAngle = slice.angle;

                ctx.fillStyle = item.color;

                ctx.beginPath();
                ctx.moveTo(260, 260);
                ctx.arc(260, 260, 250, angle, angle + sliceAngle);
                ctx.closePath();
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.save();
                ctx.translate(260, 260);
                ctx.rotate(angle + sliceAngle / 2);

                if (item.img) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(215, 0, 20, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(item.img, 195, -20, 40, 40);
                    ctx.restore();

                    ctx.fillStyle = "white";
                    ctx.font = "bold 20px Arial";
                    ctx.textAlign = "right";
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 4;
                    ctx.fillText(item.name, 185, 6);
                } else {
                    ctx.fillStyle = "white";
                    ctx.font = "bold 22px Arial";
                    ctx.textAlign = "right";
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 4;
                    ctx.fillText(item.name, 220, 7);
                }
                
                ctx.restore();
            });

            const currentNormalizedAngle = (2 * Math.PI - (startAngle % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI);
            let currentSliceIndex = 0;
            for (let i = 0; i < sliceAngles.length; i++) {
                if (currentNormalizedAngle >= sliceAngles[i].start && currentNormalizedAngle < sliceAngles[i].end) {
                    currentSliceIndex = i;
                    break;
                }
            }

            const pointerPath = document.getElementById('pointerPath');
            if (entries[currentSliceIndex]) {
                pointerPath.setAttribute('fill', entries[currentSliceIndex].color);
            }

            if (currentSliceIndex !== lastSliceIndex && isSpinning) {
                playTickSound();
                lastSliceIndex = currentSliceIndex;
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(260, 260, 48, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#e2e8f0';
            ctx.stroke();

            if (centerImage) {
                ctx.clip();
                ctx.drawImage(centerImage, 212, 212, 96, 96);
            }
            ctx.restore();
        }

        function updateName(index, val) {
            entries[index].name = val;
            drawWheel();
            updateChancesOverlay();
            saveData();
        }

        function updateColor(index, val) {
            entries[index].color = val;
            drawWheel();
            saveData();
        }

        function addEntry() {
            const defaultColors = ['#2563eb', '#16a34a', '#eab308', '#dc2626', '#9333ea', '#06b6d4'];
            const nextColor = defaultColors[entries.length % defaultColors.length];
            entries.push({ name: 'New Entry', color: nextColor, fakeChance: '10', realWeight: 10, img: null });
            renderEntries();
            saveData();
        }

        function removeEntry(index) {
            entries.splice(index, 1);
            renderEntries();
            saveData();
        }

        function shuffleEntries() {
            entries.sort(() => Math.random() - 0.5);
            renderEntries();
            saveData();
        }

        function sortEntries() {
            entries.sort((a, b) => a.name.localeCompare(b.name));
            renderEntries();
            saveData();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'settings') {
                const entriesBtn = document.getElementById('entriesTabBtn');
                entriesBtn.classList.add('active');
                if (isSecretButtonVisible) entriesBtn.classList.add('editing');
                document.getElementById('tabSettings').classList.add('active');
                document.getElementById('toolsBar').style.display = 'flex';
            } else {
                const historyBtn = document.getElementById('historyTabBtn');
                historyBtn.classList.add('active');
                if (isHistoryEditMode) historyBtn.classList.add('editing');
                document.getElementById('tabHistory').classList.add('active');
                document.getElementById('toolsBar').style.display = 'none';
            }
        }

        function toggleSecretButton() {
            isSecretButtonVisible = !isSecretButtonVisible;
            const secretBtn = document.getElementById('secretBtn');
            const entriesBtn = document.getElementById('entriesTabBtn');

            if (isSecretButtonVisible) {
                secretBtn.classList.add('visible');
                entriesBtn.classList.add('editing');
            } else {
                secretBtn.classList.remove('visible');
                entriesBtn.classList.remove('editing');
            }
        }

        function toggleHistoryEditMode() {
            isHistoryEditMode = !isHistoryEditMode;
            const historyBtn = document.getElementById('historyTabBtn');
            
            if (isHistoryEditMode) {
                historyBtn.classList.add('editing');
            } else {
                historyBtn.classList.remove('editing');
            }
            renderHistory();
        }

        function updateHistoryItemName(index, val) {
            history[index].name = val;
            saveData();
        }

        function updateHistoryItemTime(index, val) {
            history[index].time = val;
            saveData();
        }

        function removeHistoryItem(index) {
            history.splice(index, 1);
            renderHistory();
            saveData();
        }

        function clearAllHistory() {
            if (confirm("Are you sure you want to clear all history?")) {
                history = [];
                renderHistory();
                saveData();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('chancesOverlay');
            const toggleIcon = document.getElementById('toggleIcon');
            
            sidebar.classList.toggle('closed');
            
            if (sidebar.classList.contains('closed')) {
                overlay.classList.add('visible');
                toggleIcon.style.transform = 'rotate(180deg)';
                document.body.classList.add('sidebar-closed');
            } else {
                overlay.classList.remove('visible');
                toggleIcon.style.transform = 'rotate(0deg)';
                document.body.classList.remove('sidebar-closed');
            }
        }

        function updateChancesOverlay() {
            const list = document.getElementById('chancesList');
            list.innerHTML = '';

            const mergedChances = {};
            entries.forEach(item => {
                const name = item.name.trim() || 'Unnamed';
                const chance = parseFloat(item.fakeChance) || 0;
                if (mergedChances[name]) {
                    mergedChances[name] += chance;
                } else {
                    mergedChances[name] = chance;
                }
            });

            for (const [name, totalChance] of Object.entries(mergedChances)) {
                const row = document.createElement('div');
                row.className = 'chance-item';
                row.innerHTML = `<span>${name}</span><b>${totalChance}%</b>`;
                list.appendChild(row);
            }
        }

        function openSecretModal() {
            const list = document.getElementById('secretList');
            list.innerHTML = '';
            entries.forEach((item, i) => {
                list.innerHTML += `
                    <div class="modal-item">
                        <span>${item.name}</span>
                        <div class="percent-wrapper">
                            <input type="text" class="fake-input" value="${item.realWeight}" oninput="updateRealWeight(${i}, this.value)">
                            <span class="percent-symbol">%</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('secretModal').style.display = 'flex';
        }

        function closeSecretModal() {
            document.getElementById('secretModal').style.display = 'none';
        }

        function getWeightedRandomIndex() {
            const totalWeight = entries.reduce((sum, item) => sum + item.realWeight, 0);
            if (totalWeight <= 0) return 0;
            
            let random = Math.random() * totalWeight;
            for (let i = 0; i < entries.length; i++) {
                if (random < entries[i].realWeight) return i;
                random -= entries[i].realWeight;
            }
            return 0;
        }

        function spin() {
            if (isSpinning || entries.length === 0) return;
            initAudio();
            isSpinning = true;

            lastWinnerIndex = getWeightedRandomIndex();
            const sliceAngles = getSliceAngles();
            const winningSlice = sliceAngles[lastWinnerIndex];

            const randomOffset = (Math.random() * 0.8 + 0.1) * winningSlice.angle;
            const targetSliceAngle = winningSlice.start + randomOffset;
            
            const extraRotations = (Math.floor(Math.random() * 4) + 6) * 2 * Math.PI; 

            const currentMod = startAngle % (2 * Math.PI);
            const neededAngleChange = extraRotations + (2 * Math.PI - targetSliceAngle) - currentMod;
            
            const initialAngle = startAngle;
            const startTime = performance.now();
            const duration = 5000;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                const easeOutProgress = 1 - Math.pow(1 - progress, 3);

                startAngle = initialAngle + (neededAngleChange * easeOutProgress);
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    const winnerName = entries[lastWinnerIndex].name;
                    playWinSound();
                    addHistory(winnerName);
                    showWinnerModal(winnerName);
                }
            }

            requestAnimationFrame(animate);
        }

        function showWinnerModal(name) {
            document.getElementById('winnerNameText').innerText = name;
            document.getElementById('winnerModal').style.display = 'flex';
        }

        function closeWinnerModal() {
            document.getElementById('winnerModal').style.display = 'none';
        }

        function removeCurrentWinner() {
            if (lastWinnerIndex >= 0 && lastWinnerIndex < entries.length) {
                removeEntry(lastWinnerIndex);
            }
            closeWinnerModal();
        }

        function addHistory(name) {
            history.unshift({ name, time: new Date().toLocaleTimeString() });
            renderHistory();
            saveData();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const editControls = document.getElementById('historyEditControls');
            
            if (isHistoryEditMode) {
                editControls.style.display = 'block';
            } else {
                editControls.style.display = 'none';
            }

            if (history.length === 0) {
                list.innerHTML = `<li style="color: #94a3b8; text-align: center; margin-top: 20px;">No spins yet</li>`;
                return;
            }

            list.innerHTML = '';
            history.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';

                if (isHistoryEditMode) {
                    li.innerHTML = `
                        <button class="btn-remove" onclick="removeHistoryItem(${index})" title="Delete item">✖</button>
                        <input type="text" class="history-edit-input" style="flex: 1;" value="${item.name}" oninput="updateHistoryItemName(${index}, this.value)">
                        <input type="text" class="history-edit-input" style="width: 85px; text-align: center;" value="${item.time}" oninput="updateHistoryItemTime(${index}, this.value)">
                    `;
                } else {
                    li.innerHTML = `
                        <span><b>${item.name}</b></span>
                        <span style="color:#94a3b8">${item.time}</span>
                    `;
                }
                list.appendChild(li);
            });
        }

        document.addEventListener('click', () => {
            initAudio();
        }, { once: true });

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') spin();
        });

        loadSavedData();
        renderEntries();
    </script>
</body>
</html>
